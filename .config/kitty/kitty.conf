shell /usr/bin/fish

# ===============================
# General
# ===============================
font_family      JetBrainsMono Nerd Font
font_size        14.0
bold_brightens_ansi_colors yes
cursor_shape     block
cursor_blink     yes
scrollback_lines 10000
window_padding_width 10
# ===============================
# Colors (OLED)
# ===============================
background        #000000
foreground        #d4d4d4
cursor            #fafafa
selection_foreground #0a0a0a
selection_background #fafafa

# ===============================
# ANSI Colors
# ===============================
color0  #171717
color1  #ff6467
color2  #00d492
color3  #ffd230
color4  #74d4ff
color5  #c4b4ff
color6  #46ecd5
color7  #d4d4d4

color8  #525252
color9  #ffa2a2
color10 #5ee9b5
color11 #fee685
color12 #b8e6fe
color13 #ddd6ff
color14 #96f7e4
color15 #fafafa

# ===============================
# QoL
# ===============================
enable_audio_bell yes
bell_path /home/khaled/.local/share/sounds/ocean/stereo/bell.oga
confirm_os_window_close 0
detect_urls yes
url_style curly
