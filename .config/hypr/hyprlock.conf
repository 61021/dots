# =============================================================================
# KW Lockscreen: quiet. The picture stays bright and sharp, a small clock at
# the top, and no input box until you type. Text carries a soft shadow so it
# reads on a bright wallpaper.
# Palette: ~/stuff/constants/colors/palette.md
# =============================================================================

$fg_hi       = rgba(250, 250, 250, 1.0)
$fg          = rgba(229, 229, 229, 1.0)
$border_soft = rgba(255, 255, 255, 0.08)
$surface     = rgba(10, 10, 10, 0.6)
$shadow      = rgba(0, 0, 0, 0.7)

general {
    hide_cursor          = true
    ignore_empty_input   = true
}

# The wallpaper as it is: no blur, so brightness is set by the veil below.
background {
    monitor           =
    path              = /home/khaled/.cache/current-wallpaper
    blur_passes       = 0
}

# A black veil at 18% = the picture at 82% brightness.
shape {
    monitor     =
    size        = 6000, 6000
    color       = rgba(0, 0, 0, 0.18)
    rounding    = 0
    border_size = 0
    position    = 0, 0
    halign      = center
    valign      = center
    zindex      = -2
}

label {
    monitor     =
    text        = cmd[update:1000] date +"%-I:%M"
    color       = $fg_hi
    font_size   = 57
    font_family = IBM Plex Sans SemiBold
    shadow_passes = 3
    shadow_size   = 6
    shadow_color  = $shadow
    position    = 0, -58
    halign      = center
    valign      = top
}

label {
    monitor     =
    text        = cmd[update:60000] date +"%A %-d %B"
    color       = $fg
    font_size   = 13
    font_family = IBM Plex Sans Medium
    shadow_passes = 3
    shadow_size   = 6
    shadow_color  = $shadow
    position    = 0, -146
    halign      = center
    valign      = top
}

# Hidden until the first key.
input-field {
    monitor              =
    size                 = 280, 44
    outline_thickness    = 1
    dots_size            = 0.22
    dots_spacing         = 0.45
    dots_center          = true
    dots_rounding        = -1
    outer_color          = $border_soft
    inner_color          = $surface
    font_color           = $fg_hi
    fade_on_empty        = true
    fade_timeout         = 600
    rounding             = 12
    check_color          = $fg_hi
    fail_color           = rgba(255, 100, 103, 1.0)
    fail_text            = <i>$ATTEMPTS attempt(s), try again.</i>
    placeholder_text     =
    hide_input           = false
    position             = 0, 96
    halign               = center
    valign               = bottom
}

label {
    monitor       =
    text          = <span letter_spacing="1229">KW</span>
    color         = $fg_hi
    font_size     = 10
    font_family   = IBM Plex Sans Bold
    shadow_passes = 2
    shadow_size   = 4
    shadow_color  = $shadow
    position      = 32, 24
    halign        = left
    valign        = bottom
}

label {
    monitor       =
    text          = Memento Mori
    color         = $fg_hi
    font_size     = 10
    font_family   = IBM Plex Sans Medium
    shadow_passes = 2
    shadow_size   = 4
    shadow_color  = $shadow
    position      = -32, 24
    halign        = right
    valign        = bottom
}
